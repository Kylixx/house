<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#140a14">
<title>Наша квартира</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="cv" aria-label="Квартира"></canvas>
<div id="hud"><b id="room"></b><button id="snd" aria-label="Музыка">♪</button></div>
<div id="hint"></div>
<div id="pad"><button id="bL" aria-label="Влево">◀</button><button id="bA" aria-label="Осмотреть">✦</button><button id="bR" aria-label="Вправо">▶</button></div>
<div id="modal"></div>
<div id="intro">
  <div class="in">
    <small>для тебя</small>
    <h1>Наша <em>квартира</em></h1>
    <p>Здесь нет меню. Просто ходи по комнатам и заглядывай в каждый уголок. Там, где что-то мерцает, можно остановиться и посмотреть.</p>
    <button id="go">Войти</button>
    <span class="keys">← → или A D — ходить · E или пробел — смотреть<br>на телефоне: стрелки внизу или тап по экрану</span>
  </div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
